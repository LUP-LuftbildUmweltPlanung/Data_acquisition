  ############################################### KEEP THIS PART!!! ####################################################
- index: 0    # KEEP THIS PART!!! Explanation of parameters, update index-value when adding new requests

  ######### General: #########
  log_file: "automatic_tif_log.txt"   # log file for the download of this wms request
  directory_path: "your_directory"   # directory with the shape files that will be processed. output_dir = directory_path\\output_wms
  state_col: state # name of column that contains the state names. default: state
  year_col: year # name of column that contains the year for which to extract data for this area. default: year
  name_col: name # name of column that contains the names of the areas. default: name
  id_col: id # name of id column. default: id
  year_interval: null # set to a year or an interval start-end if you want to extract data from the same interval for all areas. Chooses the most recent year for each area. Default ""
  months: null # input months in digits like 1,2,3 for January, February, March to only extract images if they were acquired in these months
  only_dates: false # to skip the image download and only write acquisition dates for the specified years to the log file


  ######### Tile settings: #########
  r_aufl: 0.2   # spatial resolution of extracted tif files in meter (for image and meta)
  img_height: null # The height of the downloaded tiles in pixel, set to null for maximum height
  img_width: null # The width of the downloaded tiles in pixel, set to null for maximum height

  ######### WMS Image extraction: #########
  wms_calc: false    # set to true if you want to extract raster data, false otherwise
  wms_ad: ""    # wms web address for the image
  layer: ""   # name of rgb layer in wms server
  layer2: null    # name of layer with infrared as band 1 in wms server, set to null to skip
  state: null   # set to "BB_history" if the data can only be extracted in png/jpeg format instead of tif (e.g. for the historic Brandenburg wms)

  ######### Image extraction from harddrive: ##########
  folder_structure_rgb_csv: PATH # path to csv with folder structure of RGB tifs
  folder_structure_ir_csv: PATH # path to csv with folder structure of IR tifs
  harddrive_root: PATH # path to root directory of harddrive, sth like C:

  ######### Meta extraction: #########
  meta_calc: false   # set to true if you want to extract metadata, false otherwise
  wms_ad_meta: ""   # wms web address for the metadata
  layer_meta: ""    # name of layer with acquisition dates in wms server of metadata

  ######### Merging: #########
  merge: false   # set to true if tiles should be merged to one big file for each shape file, false otherwise. Attention: Big files if polygons are big or far apart
  AOI: null   # specify area of interest in name of merged meta and image files
  year: null   # specify a year in name of merged meta and image files

######################################################################################################################